<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SURVIVE.IO - REAL MULTIPLAYER</title>
  <!-- Free PeerJS Library for direct device-to-device multiplayer -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    body, html { width:100%; height:100%; overflow:hidden; background:#172216; font-family:'Segoe UI', sans-serif; }
    #canvas { display:block; width:100vw; height:100vh; }
    #ui { position:absolute; inset:0; pointer-events:none; }
    .interactive { pointer-events:auto; }

    .hud-box {
      position:absolute; background:rgba(15, 23, 42, 0.85);
      border:1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5); backdrop-filter:blur(8px);
      border-radius:12px; color:#fff;
    }

    /* Lobby Join Screen */
    #lobby-modal {
      position:absolute; inset:0; background:rgba(0,0,0,0.8);
      display:flex; justify-content:center; align-items:center; z-index:99;
    }
    .lobby-card {
      background:#0f172a; padding:24px; border-radius:14px; border:1px solid #334155;
      text-align:center; color:#fff; width:340px; box-shadow:0 0 30px rgba(0,0,0,0.8);
    }
    .lobby-card input {
      width:100%; padding:10px; margin:10px 0; border-radius:6px;
      border:1px solid #475569; background:#1e293b; color:#fff; font-size:14px; text-align:center;
    }
    .lobby-card button {
      width:100%; padding:10px; margin-top:6px; border-radius:6px;
      border:none; background:#3b82f6; color:#fff; font-weight:bold; cursor:pointer; font-size:14px;
    }
    .lobby-card button:hover { background:#2563eb; }

    #res { top:16px; left:16px; padding:10px 18px; display:flex; gap:16px; font-size:13px; font-weight:700; }
    #leaderboard { top:16px; right:16px; padding:12px 16px; min-width:170px; font-size:12px; }
    #leaderboard h3 { color:#fbbf24; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:4px; margin-bottom:6px; }

    #stats { bottom:18px; left:18px; width:220px; padding:12px; }
    .bar-bg { width:100%; height:12px; background:#1e293b; border-radius:6px; overflow:hidden; margin-top:4px; margin-bottom:8px; }
    .bar-fill { height:100%; transition:width 0.15s ease-out; }
    .bar-hp { background:linear-gradient(90deg, #ef4444, #f87171); }
    .bar-hunger { background:linear-gradient(90deg, #f59e0b, #fbbf24); }

    #crafting { right:18px; top:50%; transform:translateY(-50%); padding:12px; display:flex; flex-direction:column; gap:8px; width:180px; }
    .craft-btn { background:#1e293b; color:#fff; border:1px solid #334155; padding:8px 10px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer; display:flex; justify-content:space-between; }
    .craft-btn:hover:not(:disabled) { background:#3b82f6; }
    .craft-btn:disabled { opacity:0.4; }

    #room-tag { position:absolute; bottom:18px; right:18px; padding:8px 14px; font-size:12px; font-weight:bold; color:#38bdf8; }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- Lobby Modal -->
<div id="lobby-modal" class="interactive">
  <div class="lobby-card">
    <h2 style="color:#38bdf8; margin-bottom:6px;">SURVIVE.IO</h2>
    <p style="font-size:12px; color:#94a3b8; margin-bottom:14px;">साथ में खेलने के लिए रूम बनाएं या जॉइन करें</p>
    <input type="text" id="p-name" placeholder="अपना नाम दर्ज करें" value="Player1">
    <button onclick="multiplayer.hostRoom()">🏠 रूम होस्ट करें (Host Room)</button>
    <div style="margin:12px 0; color:#64748b; font-size:12px;">— या कोड से जुड़ें —</div>
    <input type="text" id="join-code" placeholder="रूम कोड (उदा: 5421)">
    <button onclick="multiplayer.joinRoom()" style="background:#10b981;">🎮 रूम जॉइन करें (Join)</button>
    <button onclick="multiplayer.playSolo()" style="background:#475569; margin-top:12px;">👤 अकेले खेलें (Solo Bots)</button>
  </div>
</div>

<div id="ui">
  <div id="res" class="hud-box">
    <div>🌲 लकड़ी: <span id="val-w" style="color:#38bdf8">0</span></div>
    <div>⛏️ पत्थर: <span id="val-s" style="color:#38bdf8">0</span></div>
    <div>🍎 भोजन: <span id="val-f" style="color:#38bdf8">0</span></div>
  </div>

  <div id="leaderboard" class="hud-box">
    <h3>🏆 लाइव प्लेयर्स</h3>
    <div id="lb-list">कनेक्टिंग...</div>
  </div>

  <div id="stats" class="hud-box">
    <div style="font-size:11px; font-weight:bold;">स्वास्थ्य (HP) <span id="hp-txt" style="float:right;">100</span></div>
    <div class="bar-bg"><div id="hp-bar" class="bar-fill bar-hp" style="width:100%"></div></div>
    <div style="font-size:11px; font-weight:bold;">ऊर्जा (Hunger) <span id="hunger-txt" style="float:right;">100%</span></div>
    <div class="bar-bg"><div id="hunger-bar" class="bar-fill bar-hunger" style="width:100%"></div></div>
  </div>

  <div id="crafting" class="hud-box interactive">
    <div style="font-size:11px; font-weight:bold; color:#f59e0b;">🔨 क्राफ्टिंग</div>
    <button class="craft-btn" id="btn-eat" onclick="game.eat()"><span>🍎 खाना खाएं</span><small>+25 HP</small></button>
    <button class="craft-btn" id="btn-pick" onclick="game.craft('pickaxe')"><span>⛏️ Pickaxe</span><small>15 Wood</small></button>
    <button class="craft-btn" id="btn-sword" onclick="game.craft('sword')"><span>⚔️ Sword</span><small>20W, 15S</small></button>
  </div>

  <div id="room-tag" class="hud-box">Room: Solo</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const WORLD = 2400;

class MultiplayerManager {
  constructor() {
    this.peer = null;
    this.connections = [];
    this.isHost = false;
    this.roomCode = null;
    this.networkPlayers = {};
  }

  hostRoom() {
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    this.roomCode = code;
    this.isHost = true;
    this.peer = new Peer('survive-' + code);

    this.peer.on('open', (id) => {
      document.getElementById('lobby-modal').style.display = 'none';
      document.getElementById('room-tag').innerText = 'रूम कोड: ' + code + ' (दोस्त को ये कोड दें)';
      game.player.name = document.getElementById('p-name').value || 'Host';
    });

    this.peer.on('connection', (conn) => {
      this.connections.push(conn);
      conn.on('data', (data) => this.handleData(conn, data));
      conn.on('open', () => {
        // Send initial world to client
        conn.send({ type: 'initWorld', resources: game.resources });
      });
    });

    this.peer.on('error', () => alert('इस कोड से रूम नहीं बन पाया, दोबारा कोशिश करें!'));
  }

  joinRoom() {
    const code = document.getElementById('join-code').value.trim();
    if (!code) return alert('कृपया 4 अंकों का रूम कोड डालें!');
    this.peer = new Peer();

    this.peer.on('open', () => {
      const conn = this.peer.connect('survive-' + code);
      conn.on('open', () => {
        this.connections.push(conn);
        document.getElementById('lobby-modal').style.display = 'none';
        document.getElementById('room-tag').innerText = 'जुड़े हुए रूम: ' + code;
        game.player.name = document.getElementById('p-name').value || 'Client';
        game.bots = []; // Remove bots in real multiplayer
      });
      conn.on('data', (data) => this.handleData(conn, data));
    });

    this.peer.on('error', () => alert('रूम नहीं मिला! चेक करें कि होस्ट ऑनलाइन है या कोड सही है।'));
  }

  playSolo() {
    document.getElementById('lobby-modal').style.display = 'none';
    game.player.name = document.getElementById('p-name').value || 'Player';
  }

  send(data) {
    this.connections.forEach(conn => {
      if (conn.open) conn.send(data);
    });
  }

  handleData(conn, data) {
    if (data.type === 'update') {
      this.networkPlayers[data.id] = data.player;
    } else if (data.type === 'initWorld') {
      game.resources = data.resources;
    }
  }
}

const multiplayer = new MultiplayerManager();

class GameEngine {
  constructor() {
    this.mouse = { x: canvas.width/2, y: canvas.height/2, down: false };
    this.keys = {};
    this.player = {
      x: WORLD/2, y: WORLD/2, r: 24, angle: 0,
      hp: 100, hunger: 100, wood: 10, stone: 0, food: 5, score: 0,
      weapon: 'fist', swing: 0, name: 'Player'
    };
    this.resources = [];
    this.bots = [];
    this.init();
    this.bind();
  }

  init() {
    for (let i = 0; i < 75; i++) {
      this.resources.push({
        id: i,
        x: Math.random() * (WORLD - 300) + 150,
        y: Math.random() * (WORLD - 300) + 150,
        type: Math.random() < 0.65 ? 'tree' : 'rock',
        r: 32, hp: 80
      });
    }

    const bnames = ['Ninja_Bot', 'Viper_Bot', 'Shadow_Bot'];
    bnames.forEach(name => {
      this.bots.push({
        name, x: Math.random()*WORLD, y: Math.random()*WORLD,
        r: 24, angle: 0, hp: 100, score: 30, weapon: 'fist', swing: 0,
        tx: Math.random()*WORLD, ty: Math.random()*WORLD, t: 0
      });
    });
  }

  bind() {
    window.addEventListener('keydown', e => this.keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => { this.mouse.x = e.clientX; this.mouse.y = e.clientY; });
    window.addEventListener('mousedown', () => { this.mouse.down = true; this.hit(this.player); });
    window.addEventListener('mouseup', () => this.mouse.down = false);
  }

  hit(p) {
    if (p.swing <= 0) p.swing = 1.0;
  }

  eat() {
    if (this.player.food > 0 && this.player.hp < 100) {
      this.player.food--;
      this.player.hp = Math.min(100, this.player.hp + 25);
      this.player.hunger = Math.min(100, this.player.hunger + 30);
      this.updateHUD();
    }
  }

  craft(type) {
    if (type === 'pickaxe' && this.player.wood >= 15) { this.player.wood -= 15; this.player.weapon = 'pickaxe'; }
    if (type === 'sword' && this.player.wood >= 20 && this.player.stone >= 15) { this.player.wood -= 20; this.player.stone -= 15; this.player.weapon = 'sword'; }
    this.updateHUD();
  }

  update() {
    this.player.angle = Math.atan2(this.mouse.y - canvas.height/2, this.mouse.x - canvas.width/2);
    let dx = 0, dy = 0;
    if (this.keys['w'] || this.keys['arrowup']) dy -= 1;
    if (this.keys['s'] || this.keys['arrowdown']) dy += 1;
    if (this.keys['a'] || this.keys['arrowleft']) dx -= 1;
    if (this.keys['d'] || this.keys['arrowright']) dx += 1;
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }

    this.player.x = Math.max(30, Math.min(WORLD - 30, this.player.x + dx * 4.8));
    this.player.y = Math.max(30, Math.min(WORLD - 30, this.player.y + dy * 4.8));

    this.player.hunger = Math.max(0, this.player.hunger - 0.01);
    if (this.player.hunger === 0) this.player.hp = Math.max(0, this.player.hp - 0.03);

    if (this.player.swing > 0) {
      this.player.swing -= 0.16;
      if (this.player.swing <= 0) this.resolveCombat(this.player);
    }
    if (this.mouse.down && this.player.swing <= 0) this.hit(this.player);

    // Send my position to friends in room
    if (multiplayer.peer) {
      multiplayer.send({
        type: 'update',
        id: multiplayer.peer.id,
        player: {
          x: this.player.x, y: this.player.y, angle: this.player.angle,
          weapon: this.player.weapon, swing: this.player.swing,
          hp: this.player.hp, name: this.player.name, score: this.player.score
        }
      });
    }

    // Bots logic (only if solo)
    this.bots.forEach(b => {
      b.t++;
      let d = Math.hypot(this.player.x - b.x, this.player.y - b.y);
      if (d < 180) { b.tx = this.player.x; b.ty = this.player.y; if (d < 60) this.hit(b); }
      else if (b.t % 90 === 0) { b.tx = b.x + (Math.random()-0.5)*300; b.ty = b.y + (Math.random()-0.5)*300; }
      b.angle = Math.atan2(b.ty - b.y, b.tx - b.x);
      b.x += Math.cos(b.angle)*2.2; b.y += Math.sin(b.angle)*2.2;
      if (b.swing > 0) { b.swing -= 0.16; if (b.swing <= 0) this.resolveCombat(b); }
    });

    this.updateHUD();
  }

  resolveCombat(char) {
    const reach = 52;
    const hx = char.x + Math.cos(char.angle) * reach;
    const hy = char.y + Math.sin(char.angle) * reach;

    // Hit trees/stone
    for (let i = this.resources.length - 1; i >= 0; i--) {
      let r = this.resources[i];
      if (Math.hypot(hx - r.x, hy - r.y) < r.r + 20) {
        let dmg = char.weapon === 'sword' ? 35 : char.weapon === 'pickaxe' ? 25 : 12;
        r.hp -= dmg;
        if (char === this.player) {
          if (r.type === 'tree') { this.player.wood += 4; if (Math.random()<0.35) this.player.food += 1; }
          else { this.player.stone += 3; }
          this.player.score += 6;
        }
        if (r.hp <= 0) this.resources.splice(i, 1);
        break;
      }
    }
  }

  updateHUD() {
    document.getElementById('val-w').innerText = this.player.wood;
    document.getElementById('val-s').innerText = this.player.stone;
    document.getElementById('val-f').innerText = this.player.food;
    document.getElementById('hp-bar').style.width = Math.max(0, this.player.hp) + '%';
    document.getElementById('hp-txt').innerText = Math.round(this.player.hp);
    document.getElementById('hunger-bar').style.width = Math.max(0, this.player.hunger) + '%';
    document.getElementById('hunger-txt').innerText = Math.round(this.player.hunger) + '%';
    document.getElementById('btn-pick').disabled = this.player.wood < 15;
    document.getElementById('btn-sword').disabled = (this.player.wood < 20 || this.player.stone < 15);

    let list = [{ name: this.player.name + ' (You)', score: this.player.score }];
    for (let id in multiplayer.networkPlayers) {
      let np = multiplayer.networkPlayers[id];
      list.push({ name: np.name || 'Friend', score: np.score || 0 });
    }
    this.bots.forEach(b => list.push({ name: b.name, score: b.score }));
    list.sort((a,b) => b.score - a.score);
    document.getElementById('lb-list').innerHTML = list.slice(0, 5).map((p,i)=>`<div>${i+1}. ${p.name} <strong>${p.score}</strong></div>`).join('');
  }

  render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(canvas.width/2 - this.player.x, canvas.height/2 - this.player.y);

    // Map & Border
    ctx.strokeStyle = '#222f20'; ctx.lineWidth = 1.5;
    for (let x = 0; x <= WORLD; x += 75) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD); ctx.stroke(); }
    for (let y = 0; y <= WORLD; y += 75) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD, y); ctx.stroke(); }
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 8; ctx.strokeRect(0, 0, WORLD, WORLD);

    // Trees & Stones
    this.resources.forEach(r => {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(r.x+5, r.y+5, r.r, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
      ctx.fillStyle = r.type === 'tree' ? '#22c55e' : '#94a3b8'; ctx.fill();
      ctx.strokeStyle = r.type === 'tree' ? '#15803d' : '#475569'; ctx.lineWidth = 4; ctx.stroke();
    });

    // Real Online Friends
    for (let id in multiplayer.networkPlayers) {
      let np = multiplayer.networkPlayers[id];
      this.drawChar(np, '#10b981', np.name || 'Friend');
    }

    // Bots
    this.bots.forEach(b => this.drawChar(b, '#ef4444', b.name));

    // You
    this.drawChar(this.player, '#0ea5e9', this.player.name + ' (You)');
    ctx.restore();
  }

  drawChar(char, color, name) {
    ctx.save();
    ctx.translate(char.x, char.y);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(name, 0, -32);
    ctx.rotate(char.angle);
    ctx.fillStyle = '#f59e0b';
    let po = char.swing > 0 ? 12 : 0;
    ctx.beginPath(); ctx.arc(20 + po, 12, 7, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(20, -12, 7, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, char.r, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3.5; ctx.stroke();
    ctx.restore();
  }

  loop() {
    this.update();
    this.render();
    requestAnimationFrame(() => this.loop());
  }
}

const game = new GameEngine();
game.loop();
</script>
</body>
</html>
