<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SURVIVAL 3D - REAL 3D MODELS</title>
  <!-- Three.js Engine, GLTF 3D Model Loader & PeerJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    body, html { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI', sans-serif; }
    #canvas3d { width:100vw; height:100vh; display:block; }
    #ui { position:absolute; inset:0; pointer-events:none; }
    .interactive { pointer-events:auto; }

    /* Crosshair */
    #crosshair {
      position:absolute; top:50%; left:50%; width:16px; height:16px;
      transform:translate(-50%, -50%); pointer-events:none;
    }
    #crosshair::before, #crosshair::after { content:''; position:absolute; background:rgba(255,255,255,0.9); box-shadow:0 0 4px rgba(0,0,0,0.8); }
    #crosshair::before { top:7px; left:-6px; width:28px; height:2px; }
    #crosshair::after { top:-6px; left:7px; width:2px; height:28px; }

    .hud-box {
      position:absolute; background:rgba(15, 23, 42, 0.88);
      border:1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); backdrop-filter:blur(10px);
      border-radius:12px; color:#fff;
    }

    #res { top:16px; left:16px; padding:12px 20px; display:flex; gap:18px; font-size:14px; font-weight:800; }
    .res-val { color:#38bdf8; margin-left:4px; }

    #controls-guide {
      top:16px; left:50%; transform:translateX(-50%);
      padding:8px 18px; font-size:12px; display:flex; gap:12px; align-items:center;
      background:rgba(15,23,42,0.85); border:1px solid rgba(255,255,255,0.2); border-radius:30px;
    }
    .key-badge { background:#334155; padding:2px 8px; border-radius:5px; font-weight:bold; color:#38bdf8; border:1px solid #475569; }

    #stats { bottom:20px; left:20px; width:230px; padding:14px; }
    .bar-bg { width:100%; height:12px; background:#1e293b; border-radius:6px; overflow:hidden; margin:4px 0 8px; border:1px solid rgba(255,255,255,0.1); }
    .bar-fill { height:100%; transition:width 0.2s ease-out; }
    .bar-hp { background:linear-gradient(90deg, #ef4444, #f87171); }
    .bar-hunger { background:linear-gradient(90deg, #f59e0b, #fbbf24); }

    #crafting { right:20px; top:50%; transform:translateY(-50%); padding:14px; display:flex; flex-direction:column; gap:8px; width:210px; }
    .c-btn { background:#1e293b; color:#fff; border:1px solid #475569; padding:9px 12px; border-radius:8px; font-size:12px; font-weight:bold; cursor:pointer; display:flex; justify-content:space-between; align-items:center; transition:0.2s; }
    .c-btn:hover:not(:disabled) { background:#2563eb; border-color:#60a5fa; transform:scale(1.02); }
    .c-btn:disabled { opacity:0.35; cursor:not-allowed; }

    #minimap-wrap {
      position:absolute; bottom:20px; right:20px; width:150px; height:150px;
      border-radius:50%; overflow:hidden; border:3px solid #38bdf8;
      box-shadow:0 0 25px rgba(56, 189, 248, 0.45); background:#142417;
    }
    #minimap { width:100%; height:100%; display:block; }

    #loading-screen {
      position:absolute; inset:0; background:#0b1320; color:#38bdf8;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      z-index:200; font-weight:bold; font-size:18px;
    }

    #lobby {
      position:absolute; inset:0; background:rgba(10,15,25,0.85);
      display:none; justify-content:center; align-items:center; z-index:100;
    }
    .card { background:#0f172a; padding:28px; border-radius:16px; border:1px solid #334155; width:340px; text-align:center; color:#fff; box-shadow:0 0 40px rgba(0,0,0,0.8); }
    .card input { width:100%; padding:11px; margin:8px 0; border-radius:8px; border:1px solid #475569; background:#1e293b; color:#fff; text-align:center; }
    .card button { width:100%; padding:11px; margin-top:6px; border-radius:8px; border:none; font-weight:bold; cursor:pointer; color:#fff; font-size:14px; transition:0.2s; }
  </style>
</head>
<body>

<div id="loading-screen">
  <div style="font-size:28px; margin-bottom:10px;">🌲 3D SURVIVAL WORLD</div>
  <div id="load-status" style="font-size:14px; color:#94a3b8;">3D मॉडल्स और टेक्सचर लोड हो रहे हैं...</div>
</div>

<canvas id="canvas3d"></canvas>
<div id="crosshair"></div>

<!-- Multiplayer Lobby -->
<div id="lobby" class="interactive">
  <div class="card">
    <h2 style="color:#38bdf8; margin-bottom:4px;">SURVIVAL 3D</h2>
    <p style="font-size:12px; color:#94a3b8; margin-bottom:12px;">Real-World Open 3D Environment</p>
    <input type="text" id="pname" placeholder="अपना नाम लिखें" value="Player1">
    <button onclick="net.host()" style="background:#2563eb;">🏠 3D रूम होस्ट करें (Host)</button>
    <div style="margin:10px 0; font-size:12px; color:#64748b;">— या कोड से जुड़ें —</div>
    <input type="text" id="jcode" placeholder="4-digit रूम कोड">
    <button onclick="net.join()" style="background:#059669;">🎮 रूम में प्रवेश करें (Join)</button>
    <button onclick="net.solo()" style="background:#475569; margin-top:10px;">👤 अकेले खेलें (Solo)</button>
  </div>
</div>

<div id="ui">
  <div id="controls-guide">
    <div><span class="key-badge">W A S D</span> चलें</div>
    <div><span class="key-badge">SPACE</span> कूदें</div>
    <div><span class="key-badge">E</span> खाना</div>
    <div><span class="key-badge">1, 2, 3</span> हथियार</div>
    <div><span class="key-badge">Click</span> अटैक / काटना</div>
  </div>

  <div id="res" class="hud-box">
    <div>🌲 लकड़ी:<span id="vw" class="res-val">0</span></div>
    <div>⛏️ पत्थर:<span id="vs" class="res-val">0</span></div>
    <div>🍎 भोजन:<span id="vf" class="res-val">5</span></div>
  </div>

  <div id="stats" class="hud-box">
    <div style="font-size:11px; font-weight:bold;">स्वास्थ्य (HP) <span id="hp-t" style="float:right;">100</span></div>
    <div class="bar-bg"><div id="hp-b" class="bar-fill bar-hp" style="width:100%"></div></div>
    <div style="font-size:11px; font-weight:bold;">ऊर्जा (Hunger) <span id="hun-t" style="float:right;">100%</span></div>
    <div class="bar-bg"><div id="hun-b" class="bar-fill bar-hunger" style="width:100%"></div></div>
  </div>

  <div id="crafting" class="hud-box interactive">
    <div style="font-size:11px; font-weight:bold; color:#f59e0b; margin-bottom:4px;">🔨 क्राफ्टिंग</div>
    <button class="c-btn" onclick="world.eat()"><span>[E] 🍎 सेब खाएं</span><small>+25 HP</small></button>
    <button class="c-btn" id="b-pick" onclick="world.craft('pickaxe')"><span>[2] ⛏️ Pickaxe</span><small>15 Wood</small></button>
    <button class="c-btn" id="b-sw" onclick="world.craft('sword')"><span>[3] ⚔️ Sword</span><small>20W, 15S</small></button>
  </div>

  <div id="minimap-wrap">
    <canvas id="minimap"></canvas>
  </div>
</div>

<script>
// Multiplayer Network
class NetManager {
  constructor() {
    this.peer = null;
    this.conn = null;
  }
  host() {
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    this.peer = new Peer('s3d-' + code);
    this.peer.on('open', () => {
      document.getElementById('lobby').style.display = 'none';
      world.initAudio();
    });
    this.peer.on('connection', c => {
      this.conn = c;
      c.on('data', d => world.updateRemotePlayer(d));
    });
  }
  join() {
    const code = document.getElementById('jcode').value.trim();
    if (!code) return alert('कोड दर्ज करें!');
    this.peer = new Peer();
    this.peer.on('open', () => {
      this.conn = this.peer.connect('s3d-' + code);
      this.conn.on('open', () => {
        document.getElementById('lobby').style.display = 'none';
        world.initAudio();
      });
      this.conn.on('data', d => world.updateRemotePlayer(d));
    });
  }
  solo() {
    document.getElementById('lobby').style.display = 'none';
    world.initAudio();
  }
  send(data) {
    if (this.conn && this.conn.open) this.conn.send(data);
  }
}
const net = new NetManager();

class World3D {
  constructor() {
    this.container = document.getElementById('canvas3d');
    this.mCanvas = document.getElementById('minimap');
    this.mCtx = this.mCanvas.getContext('2d');
    this.mCanvas.width = 150; this.mCanvas.height = 150;

    this.res = { wood: 0, stone: 0, food: 5, hp: 100, hunger: 100, weapon: 'fist' };

    // Scene & Renderer
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x76b6e4);
    this.scene.fog = new THREE.FogExp2(0x76b6e4, 0.009);

    this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    this.renderer = new THREE.WebGLRenderer({ canvas: this.container, antialias: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // Lighting
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x445533, 0.8);
    this.scene.add(hemiLight);

    this.sun = new THREE.DirectionalLight(0xfffae0, 1.3);
    this.sun.position.set(70, 120, 50);
    this.sun.castShadow = true;
    this.sun.shadow.mapSize.width = 2048;
    this.sun.shadow.mapSize.height = 2048;
    const d = 150;
    this.sun.shadow.camera.left = -d; this.sun.shadow.camera.right = d;
    this.sun.shadow.camera.top = d; this.sun.shadow.camera.bottom = -d;
    this.scene.add(this.sun);

    this.trees = [];
    this.rocks = [];
    this.particles = [];
    this.remoteMesh = null;

    this.keys = {};
    this.mouseRot = { yaw: 0, pitch: 0.12 };
    this.swinging = false;
    this.swingProgress = 0;
    this.velocityY = 0;
    this.isGrounded = true;

    // GLTF Character & Animation Mixer
    this.mixer = null;
    this.actions = {};
    this.activeAction = null;
    this.charModel = null;
    this.clock = new THREE.Clock();

    this.buildTerrain();
    this.loadReal3DCharacter();
    this.populateWorld();
    this.bindEvents();
  }

  initAudio() {
    this.actx = new (window.AudioContext || window.webkitAudioContext)();
  }

  playBeep(f, dur) {
    if (!this.actx) return;
    try {
      const osc = this.actx.createOscillator();
      const g = this.actx.createGain();
      osc.connect(g); g.connect(this.actx.destination);
      osc.frequency.setValueAtTime(f, this.actx.currentTime);
      g.gain.setValueAtTime(0.2, this.actx.currentTime);
      g.gain.linearRampToValueAtTime(0.01, this.actx.currentTime + dur);
      osc.start(); osc.stop(this.actx.currentTime + dur);
    } catch(e){}
  }

  createProceduralGrassTexture() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#417d35';
    ctx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 5000; i++) {
      ctx.fillStyle = Math.random() < 0.5 ? '#366b2c' : '#4d8f3f';
      ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 3);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(40, 40);
    return tex;
  }

  buildTerrain() {
    const grassTex = this.createProceduralGrassTexture();
    const geo = new THREE.PlaneGeometry(350, 350);
    geo.rotateX(-Math.PI / 2);
    const mat = new THREE.MeshLambertMaterial({ map: grassTex });
    const ground = new THREE.Mesh(geo, mat);
    ground.receiveShadow = true;
    this.scene.add(ground);
  }

  // Load Real 3D Humanoid Robot/Character via GLTFLoader
  loadReal3DCharacter() {
    this.charGroup = new THREE.Group();
    this.scene.add(this.charGroup);

    const loader = new THREE.GLTFLoader();
    // Official Three.js authentic animated low-poly character model
    const modelUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/RobotExpressive/RobotExpressive.glb';

    loader.load(modelUrl, (gltf) => {
      this.charModel = gltf.scene;
      this.charModel.scale.set(0.35, 0.35, 0.35);
      this.charModel.rotation.y = Math.PI;

      this.charModel.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      this.charGroup.add(this.charModel);

      // Setup Real Animations (Idle, Walking, Punch/Wave)
      this.mixer = new THREE.AnimationMixer(this.charModel);
      gltf.animations.forEach((clip) => {
        this.actions[clip.name] = this.mixer.clipAction(clip);
      });

      if (this.actions['Idle']) {
        this.activeAction = this.actions['Idle'];
        this.activeAction.play();
      }

      // Hide loading screen, show lobby
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('lobby').style.display = 'flex';
    }, undefined, (err) => {
      console.warn("Model fallback used");
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('lobby').style.display = 'flex';
    });
  }

  populateWorld() {
    // 3D Foliage Trees with multiple conical layers
    for (let i = 0; i < 50; i++) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.45, 0.65, 3.8, 8),
        new THREE.MeshLambertMaterial({ color: 0x4a2e18 })
      );
      trunk.position.y = 1.9;
      trunk.castShadow = true;

      const f1 = new THREE.Mesh(new THREE.ConeGeometry(2.5, 3.2, 8), new THREE.MeshLambertMaterial({ color: 0x166534 }));
      f1.position.y = 4.2;
      f1.castShadow = true;
      const f2 = new THREE.Mesh(new THREE.ConeGeometry(1.9, 2.6, 8), new THREE.MeshLambertMaterial({ color: 0x22c55e }));
      f2.position.y = 5.6;
      f2.castShadow = true;

      tree.add(trunk, f1, f2);
      tree.position.set((Math.random() - 0.5) * 280, 0, (Math.random() - 0.5) * 280);
      tree.userData = { type: 'tree', hp: 80 };
      this.scene.add(tree);
      this.trees.push(tree);
    }

    // 3D Realistic Boulders
    for (let i = 0; i < 35; i++) {
      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1.6 + Math.random() * 0.8, 1),
        new THREE.MeshLambertMaterial({ color: 0x64748b })
      );
      rock.scale.set(1.4, 0.85, 1.3);
      rock.position.set((Math.random() - 0.5) * 280, 0.85, (Math.random() - 0.5) * 280);
      rock.castShadow = true;
      rock.receiveShadow = true;
      rock.userData = { type: 'rock', hp: 100 };
      this.scene.add(rock);
      this.rocks.push(rock);
    }
  }

  bindEvents() {
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      this.keys[k] = true;

      if (k === 'e') this.eat();
      if (k === '1') this.switchWeapon('fist');
      if (k === '2') this.craft('pickaxe');
      if (k === '3') this.craft('sword');
      if (k === ' ' && this.isGrounded) {
        this.velocityY = 0.36;
        this.isGrounded = false;
        this.playBeep(280, 0.08);
        if (this.actions['Jump']) this.actions['Jump'].play();
      }
    });

    window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);

    window.addEventListener('click', () => {
      if (document.getElementById('lobby').style.display === 'none') {
        this.container.requestPointerLock();
      }
    });

    window.addEventListener('mousemove', e => {
      if (document.pointerLockElement === this.container) {
        this.mouseRot.yaw -= e.movementX * 0.003;
        this.mouseRot.pitch -= e.movementY * 0.003;
        this.mouseRot.pitch = Math.max(-0.5, Math.min(0.6, this.mouseRot.pitch));
      }
    });

    window.addEventListener('mousedown', () => {
      if (document.pointerLockElement === this.container && !this.swinging) {
        this.swinging = true;
        this.swingProgress = 1.0;
        this.playBeep(220, 0.08);
        if (this.actions['Punch']) {
          this.actions['Punch'].reset().play();
        }
      }
    });

    window.addEventListener('resize', () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  switchWeapon(type) {
    this.res.weapon = type;
    this.updateHUD();
  }

  craft(type) {
    if (type === 'pickaxe' && this.res.wood >= 15) {
      this.res.wood -= 15;
      this.switchWeapon('pickaxe');
      this.playBeep(520, 0.15);
    } else if (type === 'sword' && this.res.wood >= 20 && this.res.stone >= 15) {
      this.res.wood -= 20; this.res.stone -= 15;
      this.switchWeapon('sword');
      this.playBeep(700, 0.2);
    } else if (this.res.weapon === type) {
      this.switchWeapon(type);
    }
    this.updateHUD();
  }

  eat() {
    if (this.res.food > 0 && this.res.hp < 100) {
      this.res.food--;
      this.res.hp = Math.min(100, this.res.hp + 25);
      this.res.hunger = Math.min(100, this.res.hunger + 30);
      this.playBeep(440, 0.12);
      this.updateHUD();
    }
  }

  updateHUD() {
    document.getElementById('vw').innerText = this.res.wood;
    document.getElementById('vs').innerText = this.res.stone;
    document.getElementById('vf').innerText = this.res.food;
    document.getElementById('hp-b').style.width = this.res.hp + '%';
    document.getElementById('hp-t').innerText = Math.round(this.res.hp);
    document.getElementById('hun-b').style.width = this.res.hunger + '%';
    document.getElementById('hun-t').innerText = Math.round(this.res.hunger) + '%';
    document.getElementById('b-pick').disabled = this.res.wood < 15;
    document.getElementById('b-sw').disabled = (this.res.wood < 20 || this.res.stone < 15);
  }

  spawn3DDebris(pos, color) {
    for (let i = 0; i < 6; i++) {
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.25), new THREE.MeshLambertMaterial({ color }));
      p.position.copy(pos);
      p.position.y += 1.6;
      p.userData = {
        vel: new THREE.Vector3((Math.random()-0.5)*0.25, Math.random()*0.3, (Math.random()-0.5)*0.25),
        life: 1.0
      };
      this.scene.add(p);
      this.particles.push(p);
    }
  }

  updateRemotePlayer(d) {
    if (!this.remoteMesh) {
      this.remoteMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.6, 0.6, 2, 16),
        new THREE.MeshLambertMaterial({ color: 0x10b981 })
      );
      this.scene.add(this.remoteMesh);
    }
    this.remoteMesh.position.set(d.x, d.y, d.z);
    this.remoteMesh.rotation.y = d.rot;
  }

  update() {
    const delta = this.clock.getDelta();
    if (this.mixer) this.mixer.update(delta);

    this.charGroup.rotation.y = this.mouseRot.yaw;

    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.mouseRot.yaw);
    const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.mouseRot.yaw);
    const speed = 0.28;

    let isMoving = false;
    if (this.keys['w']) { this.charGroup.position.addScaledVector(forward, speed); isMoving = true; }
    if (this.keys['s']) { this.charGroup.position.addScaledVector(forward, -speed); isMoving = true; }
    if (this.keys['a']) { this.charGroup.position.addScaledVector(side, -speed); isMoving = true; }
    if (this.keys['d']) { this.charGroup.position.addScaledVector(side, speed); isMoving = true; }

    // Animation Switching (Idle vs Running)
    if (this.actions['Walking'] && this.actions['Idle']) {
      if (isMoving && this.activeAction !== this.actions['Walking']) {
        this.activeAction.fadeOut(0.2);
        this.activeAction = this.actions['Walking'];
        this.activeAction.reset().fadeIn(0.2).play();
      } else if (!isMoving && this.activeAction !== this.actions['Idle']) {
        this.activeAction.fadeOut(0.2);
        this.activeAction = this.actions['Idle'];
        this.activeAction.reset().fadeIn(0.2).play();
      }
    }

    // Jumping physics
    if (!this.isGrounded) {
      this.charGroup.position.y += this.velocityY;
      this.velocityY -= 0.022;
      if (this.charGroup.position.y <= 0) {
        this.charGroup.position.y = 0;
        this.velocityY = 0;
        this.isGrounded = true;
      }
    }

    // Camera follow (Over-the-shoulder RPG style)
    const camOffset = new THREE.Vector3(0.9, 3.2 + this.mouseRot.pitch * 3.2, 5.8).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.mouseRot.yaw);
    this.camera.position.copy(this.charGroup.position).add(camOffset);
    this.camera.lookAt(
      this.charGroup.position.x + Math.sin(this.mouseRot.yaw) * 4,
      this.charGroup.position.y + 1.8 - Math.sin(this.mouseRot.pitch) * 2,
      this.charGroup.position.z - Math.cos(this.mouseRot.yaw) * 4
    );

    // Harvest action timer
    if (this.swinging) {
      this.swingProgress -= 0.14;
      if (this.swingProgress <= 0) {
        this.swinging = false;
        this.resolveHarvest();
      }
    }

    // Particles update
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.position.add(p.userData.vel);
      p.userData.life -= 0.04;
      if (p.userData.life <= 0) {
        this.scene.remove(p);
        this.particles.splice(i, 1);
      }
    }

    net.send({
      x: this.charGroup.position.x,
      y: this.charGroup.position.y,
      z: this.charGroup.position.z,
      rot: this.charGroup.rotation.y
    });

    this.renderer.render(this.scene, this.camera);
    this.renderMinimap();
  }

  resolveHarvest() {
    const pPos = this.charGroup.position;
    this.trees.forEach(t => {
      if (pPos.distanceTo(t.position) < 5.2) {
        t.userData.hp -= (this.res.weapon === 'pickaxe' ? 30 : this.res.weapon === 'sword' ? 22 : 14);
        this.spawn3DDebris(t.position, 0x166534);
        this.playBeep(180, 0.1);
        this.res.wood += 5;
        if (Math.random() < 0.4) this.res.food += 1;
        this.updateHUD();
      }
    });

    this.rocks.forEach(r => {
      if (pPos.distanceTo(r.position) < 4.8) {
        r.userData.hp -= (this.res.weapon === 'pickaxe' ? 35 : this.res.weapon === 'sword' ? 15 : 10);
        this.spawn3DDebris(r.position, 0x64748b);
        this.playBeep(320, 0.1);
        this.res.stone += 4;
        this.updateHUD();
      }
    });
  }

  renderMinimap() {
    const ctx = this.mCtx;
    ctx.clearRect(0, 0, 150, 150);
    const center = 75;
    const scale = 0.65;

    ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
    ctx.beginPath(); ctx.arc(center, center, 45, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(center, center, 70, 0, Math.PI * 2); ctx.stroke();

    const px = this.charGroup.position.x;
    const pz = this.charGroup.position.z;

    // Trees on Minimap
    ctx.fillStyle = '#22c55e';
    this.trees.forEach(t => {
      const dx = (t.position.x - px) * scale;
      const dz = (t.position.z - pz) * scale;
      if (Math.hypot(dx, dz) < 70) ctx.fillRect(center + dx - 2, center + dz - 2, 4, 4);
    });

    // Rocks on Minimap
    ctx.fillStyle = '#94a3b8';
    this.rocks.forEach(r => {
      const dx = (r.position.x - px) * scale;
      const dz = (r.position.z - pz) * scale;
      if (Math.hypot(dx, dz) < 70) ctx.fillRect(center + dx - 2, center + dz - 2, 4, 4);
    });

    // Player Direction Indicator
    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(-this.mouseRot.yaw);
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(0, -7);
    ctx.lineTo(6, 6);
    ctx.lineTo(-6, 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  loop() {
    this.update();
    requestAnimationFrame(() => this.loop());
  }
}

const world = new World3D();
world.loop();
</script>
