<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SURVIVAL 3D - REAL OPEN WORLD</title>
  <!-- 3D Graphics Engine & PeerJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    body, html { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI', sans-serif; }
    #canvas3d { width:100vw; height:100vh; display:block; }
    
    #ui { position:absolute; inset:0; pointer-events:none; }
    .interactive { pointer-events:auto; }

    /* Crosshair */
    #crosshair {
      position:absolute; top:50%; left:50%; width:8px; height:8px;
      background:rgba(255,255,255,0.7); border-radius:50%;
      transform:translate(-50%, -50%); border:1px solid rgba(0,0,0,0.5);
    }

    .hud-box {
      position:absolute; background:rgba(15, 23, 42, 0.85);
      border:1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); backdrop-filter:blur(8px);
      border-radius:12px; color:#fff;
    }

    #res { top:16px; left:16px; padding:12px 20px; display:flex; gap:18px; font-size:14px; font-weight:800; }
    .res-val { color:#38bdf8; }

    #stats { bottom:20px; left:20px; width:220px; padding:14px; }
    .bar-bg { width:100%; height:12px; background:#1e293b; border-radius:6px; overflow:hidden; margin:4px 0 8px; }
    .bar-fill { height:100%; transition:width 0.2s; }
    .bar-hp { background:linear-gradient(90deg, #ef4444, #f87171); }
    .bar-hunger { background:linear-gradient(90deg, #f59e0b, #fbbf24); }

    #crafting { right:20px; top:50%; transform:translateY(-50%); padding:14px; display:flex; flex-direction:column; gap:8px; width:180px; }
    .c-btn { background:#1e293b; color:#fff; border:1px solid #475569; padding:9px 12px; border-radius:8px; font-size:12px; font-weight:bold; cursor:pointer; display:flex; justify-content:space-between; }
    .c-btn:hover:not(:disabled) { background:#3b82f6; border-color:#60a5fa; }
    .c-btn:disabled { opacity:0.35; cursor:not-allowed; }

    #room-tag { position:absolute; bottom:20px; right:20px; padding:8px 16px; font-size:13px; font-weight:bold; color:#38bdf8; }

    /* Lobby */
    #lobby {
      position:absolute; inset:0; background:rgba(10,15,25,0.85);
      display:flex; justify-content:center; align-items:center; z-index:100;
    }
    .card { background:#0f172a; padding:28px; border-radius:16px; border:1px solid #334155; width:340px; text-align:center; color:#fff; }
    .card input { width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #475569; background:#1e293b; color:#fff; text-align:center; }
    .card button { width:100%; padding:11px; margin-top:6px; border-radius:8px; border:none; font-weight:bold; cursor:pointer; color:#fff; font-size:14px; }
  </style>
</head>
<body>

<canvas id="canvas3d"></canvas>
<div id="crosshair"></div>

<!-- Multiplayer Lobby -->
<div id="lobby" class="interactive">
  <div class="card">
    <h2 style="color:#38bdf8; margin-bottom:4px;">SURVIVAL 3D</h2>
    <p style="font-size:12px; color:#94a3b8; margin-bottom:12px;">Real-World Open 3D Environment</p>
    <input type="text" id="pname" placeholder="खिलाड़ी का नाम" value="Player1">
    <button onclick="net.host()" style="background:#2563eb;">🏠 3D रूम होस्ट करें (Host)</button>
    <div style="margin:10px 0; font-size:12px; color:#64748b;">— या कोड से जुड़ें —</div>
    <input type="text" id="jcode" placeholder="4-digit रूम कोड">
    <button onclick="net.join()" style="background:#059669;">🎮 रूम में प्रवेश करें (Join)</button>
    <button onclick="net.solo()" style="background:#475569; margin-top:10px;">👤 अकेले घूमें (Solo)</button>
  </div>
</div>

<div id="ui">
  <div id="res" class="hud-box">
    <div>🌲 लकड़ी: <span id="vw" class="res-val">0</span></div>
    <div>⛏️ पत्थर: <span id="vs" class="res-val">0</span></div>
    <div>🍎 भोजन: <span id="vf" class="res-val">5</span></div>
  </div>

  <div id="stats" class="hud-box">
    <div style="font-size:11px; font-weight:bold;">स्वास्थ्य (HP) <span id="hp-t" style="float:right;">100</span></div>
    <div class="bar-bg"><div id="hp-b" class="bar-fill bar-hp" style="width:100%"></div></div>
    <div style="font-size:11px; font-weight:bold;">ऊर्जा (Hunger) <span id="hun-t" style="float:right;">100%</span></div>
    <div class="bar-bg"><div id="hun-b" class="bar-fill bar-hunger" style="width:100%"></div></div>
  </div>

  <div id="crafting" class="hud-box interactive">
    <div style="font-size:11px; font-weight:bold; color:#f59e0b; margin-bottom:4px;">🔨 क्राफ्टिंग</div>
    <button class="c-btn" onclick="world.eat()"><span>🍎 सेब खाएं</span><small>+25 HP</small></button>
    <button class="c-btn" id="b-pick" onclick="world.craft('pickaxe')"><span>⛏️ Pickaxe</span><small>15 Wood</small></button>
    <button class="c-btn" id="b-sw" onclick="world.craft('sword')"><span>⚔️ Sword</span><small>20W, 15S</small></button>
  </div>

  <div id="room-tag" class="hud-box">3D World: Solo</div>
</div>

<script>
// 1. PeerJS Multiplayer Bridge
class NetManager {
  constructor() {
    this.peer = null;
    this.conn = null;
    this.otherPlayers = {};
  }
  host() {
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    this.peer = new Peer('s3d-' + code);
    this.peer.on('open', () => {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('room-tag').innerText = 'रूम कोड: ' + code;
      world.initAudio();
    });
    this.peer.on('connection', (c) => {
      this.conn = c;
      c.on('data', d => this.receive(d));
    });
  }
  join() {
    const code = document.getElementById('jcode').value.trim();
    if (!code) return alert('कोड दर्ज करें!');
    this.peer = new Peer();
    this.peer.on('open', () => {
      this.conn = this.peer.connect('s3d-' + code);
      this.conn.on('open', () => {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('room-tag').innerText = 'रूम: ' + code;
        world.initAudio();
      });
      this.conn.on('data', d => this.receive(d));
    });
  }
  solo() {
    document.getElementById('lobby').style.display = 'none';
    world.initAudio();
  }
  send(data) {
    if (this.conn && this.conn.open) this.conn.send(data);
  }
  receive(data) {
    if (data.type === 'pos') {
      world.updateRemotePlayer(data);
    }
  }
}
const net = new NetManager();

// 2. Three.js Full 3D Real-World Engine
class World3D {
  constructor() {
    this.container = document.getElementById('canvas3d');
    this.res = { wood: 0, stone: 0, food: 5, hp: 100, hunger: 100, weapon: 'fist' };
    
    // Scene, Camera, Renderer
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x87ceeb); // Real Sky Blue
    this.scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

    this.camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    this.renderer = new THREE.WebGLRenderer({ canvas: this.container, antialias: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = true;

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x445533, 0.7);
    this.scene.add(hemiLight);

    this.sun = new THREE.DirectionalLight(0xfffaed, 0.9);
    this.sun.position.set(60, 100, 40);
    this.sun.castShadow = true;
    this.scene.add(this.sun);

    // Objects
    this.trees = [];
    this.rocks = [];
    this.particles = [];
    this.remoteMesh = null;

    this.keys = {};
    this.mouseRot = { yaw: 0, pitch: 0 };
    this.swinging = false;
    this.swingProgress = 0;

    this.buildTerrain();
    this.buildPlayer();
    this.populateWorld();
    this.bindEvents();
  }

  initAudio() {
    this.actx = new (window.AudioContext || window.webkitAudioContext)();
  }

  playBeep(f, dur) {
    if (!this.actx) return;
    const osc = this.actx.createOscillator();
    const g = this.actx.createGain();
    osc.connect(g); g.connect(this.actx.destination);
    osc.frequency.setValueAtTime(f, this.actx.currentTime);
    g.gain.setValueAtTime(0.2, this.actx.currentTime);
    g.gain.linearRampToValueAtTime(0.01, this.actx.currentTime + dur);
    osc.start(); osc.stop(this.actx.currentTime + dur);
  }

  buildTerrain() {
    // 3D Grassy Ground
    const geo = new THREE.PlaneGeometry(300, 300, 40, 40);
    geo.rotateX(-Math.PI / 2);
    const mat = new THREE.MeshLambertMaterial({ color: 0x3d7e35 });
    const ground = new THREE.Mesh(geo, mat);
    ground.receiveShadow = true;
    this.scene.add(ground);

    // World Fence/Border
    const wallGeo = new THREE.BoxGeometry(300, 4, 2);
    const wallMat = new THREE.MeshLambertMaterial({ color: 0xb91c1c });
    const w1 = new THREE.Mesh(wallGeo, wallMat); w1.position.set(0, 2, 150); this.scene.add(w1);
    const w2 = new THREE.Mesh(wallGeo, wallMat); w2.position.set(0, 2, -150); this.scene.add(w2);
  }

  buildPlayer() {
    this.playerGroup = new THREE.Group();
    
    // Body (Capsule/Cylinder)
    const bodyGeo = new THREE.CylinderGeometry(0.7, 0.7, 2, 16);
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1;
    body.castShadow = true;
    this.playerGroup.add(body);

    // Head
    const headGeo = new THREE.SphereGeometry(0.5, 16, 16);
    const headMat = new THREE.MeshLambertMaterial({ color: 0xfbbf24 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.4;
    this.playerGroup.add(head);

    // Right Hand with Tool
    this.hand = new THREE.Group();
    this.hand.position.set(0.9, 1.4, 0.4);
    
    const armGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
    const armMat = new THREE.MeshLambertMaterial({ color: 0xfbbf24 });
    const arm = new THREE.Mesh(armGeo, armMat);
    this.hand.add(arm);

    // 3D Pickaxe Mesh
    this.pickMesh = new THREE.Group();
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.4), new THREE.MeshLambertMaterial({color: 0x78350f}));
    handle.rotation.x = Math.PI / 2;
    const headP = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.15, 0.15), new THREE.MeshLambertMaterial({color: 0x94a3b8}));
    headP.position.set(0, 0, 0.6);
    this.pickMesh.add(handle, headP);
    this.pickMesh.position.set(0, -0.4, 0.3);
    this.pickMesh.visible = false;
    this.hand.add(this.pickMesh);

    this.playerGroup.add(this.hand);
    this.scene.add(this.playerGroup);
  }

  populateWorld() {
    // 3D Trees with Trunk and Foliage
    for (let i = 0; i < 45; i++) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.6, 3.5, 8),
        new THREE.MeshLambertMaterial({ color: 0x5c3a21 })
      );
      trunk.position.y = 1.75;
      trunk.castShadow = true;

      const leaves = new THREE.Mesh(
        new THREE.DodecahedronGeometry(2.2, 1),
        new THREE.MeshLambertMaterial({ color: 0x15803d })
      );
      leaves.position.y = 4.2;
      leaves.castShadow = true;

      tree.add(trunk, leaves);
      tree.position.set((Math.random() - 0.5) * 260, 0, (Math.random() - 0.5) * 260);
      tree.userData = { type: 'tree', hp: 80 };
      this.scene.add(tree);
      this.trees.push(tree);
    }

    // 3D Irregular Rocks (Boulders)
    for (let i = 0; i < 30; i++) {
      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1.6 + Math.random()*0.8, 1),
        new THREE.MeshLambertMaterial({ color: 0x64748b })
      );
      rock.scale.set(1.2, 0.8, 1.2);
      rock.position.set((Math.random() - 0.5) * 260, 1.0, (Math.random() - 0.5) * 260);
      rock.castShadow = true;
      rock.userData = { type: 'rock', hp: 100 };
      this.scene.add(rock);
      this.rocks.push(rock);
    }
  }

  bindEvents() {
    window.addEventListener('keydown', e => this.keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);

    // Pointer Lock for True 3D Look
    window.addEventListener('click', () => {
      if (document.getElementById('lobby').style.display === 'none') {
        this.container.requestPointerLock();
      }
    });

    window.addEventListener('mousemove', e => {
      if (document.pointerLockElement === this.container) {
        this.mouseRot.yaw -= e.movementX * 0.003;
        this.mouseRot.pitch -= e.movementY * 0.003;
        this.mouseRot.pitch = Math.max(-0.6, Math.min(0.6, this.mouseRot.pitch));
      }
    });

    window.addEventListener('mousedown', () => {
      if (document.pointerLockElement === this.container && !this.swinging) {
        this.swinging = true;
        this.swingProgress = 1.0;
        this.playBeep(220, 0.08);
      }
    });

    window.addEventListener('resize', () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  craft(type) {
    if (type === 'pickaxe' && this.res.wood >= 15) {
      this.res.wood -= 15;
      this.res.weapon = 'pickaxe';
      this.pickMesh.visible = true;
      this.playBeep(520, 0.15);
    } else if (type === 'sword' && this.res.wood >= 20 && this.res.stone >= 15) {
      this.res.wood -= 20; this.res.stone -= 15;
      this.res.weapon = 'sword';
      this.playBeep(700, 0.2);
    }
    this.updateHUD();
  }

  eat() {
    if (this.res.food > 0) {
      this.res.food--;
      this.res.hp = Math.min(100, this.res.hp + 25);
      this.res.hunger = Math.min(100, this.res.hunger + 30);
      this.playBeep(440, 0.12);
      this.updateHUD();
    }
  }

  updateHUD() {
    document.getElementById('vw').innerText = this.res.wood;
    document.getElementById('vs').innerText = this.res.stone;
    document.getElementById('vf').innerText = this.res.food;
    document.getElementById('hp-b').style.width = this.res.hp + '%';
    document.getElementById('hp-t').innerText = Math.round(this.res.hp);
    document.getElementById('hun-b').style.width = this.res.hunger + '%';
    document.getElementById('hun-t').innerText = Math.round(this.res.hunger) + '%';
    document.getElementById('b-pick').disabled = this.res.wood < 15;
    document.getElementById('b-sw').disabled = (this.res.wood < 20 || this.res.stone < 15);
  }

  spawn3DDebris(pos, color) {
    for (let i = 0; i < 6; i++) {
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshLambertMaterial({ color }));
      p.position.copy(pos);
      p.position.y += 1.5;
      p.userData = {
        vel: new THREE.Vector3((Math.random()-0.5)*0.3, Math.random()*0.3, (Math.random()-0.5)*0.3),
        life: 1.0
      };
      this.scene.add(p);
      this.particles.push(p);
    }
  }

  updateRemotePlayer(d) {
    if (!this.remoteMesh) {
      const g = new THREE.CylinderGeometry(0.7, 0.7, 2, 16);
      const m = new THREE.MeshLambertMaterial({ color: 0x10b981 });
      this.remoteMesh = new THREE.Mesh(g, m);
      this.scene.add(this.remoteMesh);
    }
    this.remoteMesh.position.set(d.x, d.y, d.z);
    this.remoteMesh.rotation.y = d.rot;
  }

  update() {
    // Rotation & Direction
    this.playerGroup.rotation.y = this.mouseRot.yaw;

    // Movement Vectors
    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.mouseRot.yaw);
    const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.mouseRot.yaw);
    const speed = 0.28;

    if (this.keys['w']) this.playerGroup.position.addScaledVector(forward, speed);
    if (this.keys['s']) this.playerGroup.position.addScaledVector(forward, -speed);
    if (this.keys['a']) this.playerGroup.position.addScaledVector(side, -speed);
    if (this.keys['d']) this.playerGroup.position.addScaledVector(side, speed);

    // Keep Inside World Boundaries
    this.playerGroup.position.x = Math.max(-145, Math.min(145, this.playerGroup.position.x));
    this.playerGroup.position.z = Math.max(-145, Math.min(145, this.playerGroup.position.z));

    // Third-Person 3D Camera Follow
    const camOffset = new THREE.Vector3(0, 3.2 + this.mouseRot.pitch * 3, 6.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.mouseRot.yaw);
    this.camera.position.copy(this.playerGroup.position).add(camOffset);
    this.camera.lookAt(this.playerGroup.position.x, this.playerGroup.position.y + 1.8, this.playerGroup.position.z);

    // Hand Swing Animation & Harvest
    if (this.swinging) {
      this.swingProgress -= 0.12;
      this.hand.rotation.x = Math.sin(this.swingProgress * Math.PI) * 1.4;
      if (this.swingProgress <= 0) {
        this.swinging = false;
        this.hand.rotation.x = 0;
        this.resolveHarvest();
      }
    }

    // Update Particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.position.add(p.userData.vel);
      p.userData.life -= 0.04;
      if (p.userData.life <= 0) {
        this.scene.remove(p);
        this.particles.splice(i, 1);
      }
    }

    // Send Multiplayer Coordinates
    net.send({
      type: 'pos',
      x: this.playerGroup.position.x,
      y: this.playerGroup.position.y,
      z: this.playerGroup.position.z,
      rot: this.playerGroup.rotation.y
    });

    this.renderer.render(this.scene, this.camera);
  }

  resolveHarvest() {
    const pPos = this.playerGroup.position;
    // Check hit on 3D Trees
    this.trees.forEach(t => {
      if (pPos.distanceTo(t.position) < 4.5) {
        t.userData.hp -= (this.res.weapon === 'pickaxe' ? 30 : 15);
        this.spawn3DDebris(t.position, 0x15803d);
        this.playBeep(180, 0.1);
        this.res.wood += 5;
        if (Math.random() < 0.4) this.res.food += 1;
        this.updateHUD();
      }
    });

    // Check hit on 3D Rocks
    this.rocks.forEach(r => {
      if (pPos.distanceTo(r.position) < 4.2) {
        r.userData.hp -= (this.res.weapon === 'pickaxe' ? 35 : 12);
        this.spawn3DDebris(r.position, 0x64748b);
        this.playBeep(320, 0.1);
        this.res.stone += 4;
        this.updateHUD();
      }
    });
  }

  loop() {
    this.update();
    requestAnimationFrame(() => this.loop());
  }
}

const world = new World3D();
world.loop();
</script>
</body>
</html>
