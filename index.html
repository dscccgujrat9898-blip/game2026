<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SURVIVAL 3D - REAL OPEN WORLD</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    body, html { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI', sans-serif; }
    #canvas3d { width:100vw; height:100vh; display:block; }
    #ui { position:absolute; inset:0; pointer-events:none; }
    .interactive { pointer-events:auto; }

    #crosshair {
      position:absolute; top:50%; left:50%; width:10px; height:10px;
      transform:translate(-50%, -50%); pointer-events:none;
    }
    #crosshair::before, #crosshair::after { content:''; position:absolute; background:rgba(255,255,255,0.8); }
    #crosshair::before { top:4px; left:-5px; width:20px; height:2px; }
    #crosshair::after { top:-5px; left:4px; width:2px; height:20px; }

    .hud-box {
      position:absolute; background:rgba(15, 23, 42, 0.88);
      border:1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); backdrop-filter:blur(8px);
      border-radius:12px; color:#fff;
    }

    #res { top:16px; left:16px; padding:12px 20px; display:flex; gap:18px; font-size:14px; font-weight:800; }
    .res-val { color:#38bdf8; }

    #controls-guide {
      top:16px; left:50%; transform:translateX(-50%);
      padding:8px 18px; font-size:12px; display:flex; gap:14px;
      background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.15); border-radius:20px;
    }
    .key-badge { background:#334155; padding:2px 7px; border-radius:4px; font-weight:bold; color:#38bdf8; border:1px solid #64748b; }

    #stats { bottom:20px; left:20px; width:220px; padding:14px; }
    .bar-bg { width:100%; height:12px; background:#1e293b; border-radius:6px; overflow:hidden; margin:4px 0 8px; }
    .bar-fill { height:100%; transition:width 0.2s; }
    .bar-hp { background:linear-gradient(90deg, #ef4444, #f87171); }
    .bar-hunger { background:linear-gradient(90deg, #f59e0b, #fbbf24); }

    #crafting { right:20px; top:50%; transform:translateY(-50%); padding:14px; display:flex; flex-direction:column; gap:8px; width:200px; }
    .c-btn { background:#1e293b; color:#fff; border:1px solid #475569; padding:8px 10px; border-radius:8px; font-size:12px; font-weight:bold; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
    .c-btn:hover:not(:disabled) { background:#3b82f6; border-color:#60a5fa; }
    .c-btn:disabled { opacity:0.35; cursor:not-allowed; }

    #minimap-wrap {
      position:absolute; bottom:20px; right:20px; width:140px; height:140px;
      border-radius:50%; overflow:hidden; border:3px solid #38bdf8;
      box-shadow:0 0 20px rgba(56, 189, 248, 0.4); background:#152417;
    }
    #minimap { width:100%; height:100%; display:block; }

    #lobby {
      position:absolute; inset:0; background:rgba(10,15,25,0.85);
      display:flex; justify-content:center; align-items:center; z-index:100;
    }
    .card { background:#0f172a; padding:28px; border-radius:16px; border:1px solid #334155; width:340px; text-align:center; color:#fff; }
    .card input { width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #475569; background:#1e293b; color:#fff; text-align:center; }
    .card button { width:100%; padding:11px; margin-top:6px; border-radius:8px; border:none; font-weight:bold; cursor:pointer; color:#fff; font-size:14px; }
  </style>
</head>
<body>

<canvas id="canvas3d"></canvas>
<div id="crosshair"></div>

<!-- Lobby -->
<div id="lobby" class="interactive">
  <div class="card">
    <h2 style="color:#38bdf8; margin-bottom:4px;">SURVIVAL 3D</h2>
    <p style="font-size:12px; color:#94a3b8; margin-bottom:12px;">Humanoid Character & Open World</p>
    <input type="text" id="pname" placeholder="खिलाड़ी का नाम" value="Player1">
    <button onclick="net.host()" style="background:#2563eb;">🏠 3D रूम होस्ट करें (Host)</button>
    <div style="margin:10px 0; font-size:12px; color:#64748b;">— या कोड से जुड़ें —</div>
    <input type="text" id="jcode" placeholder="4-digit रूम कोड">
    <button onclick="net.join()" style="background:#059669;">🎮 रूम में प्रवेश करें (Join)</button>
    <button onclick="net.solo()" style="background:#475569; margin-top:10px;">👤 अकेले खेलें (Solo)</button>
  </div>
</div>

<div id="ui">
  <div id="controls-guide">
    <div><span class="key-badge">W,A,S,D</span> चालें</div>
    <div><span class="key-badge">SPACE</span> कूदें</div>
    <div><span class="key-badge">E</span> खाना खाएं</div>
    <div><span class="key-badge">Click</span> अटैक / काटना</div>
  </div>

  <div id="res" class="hud-box">
    <div>🌲 लकड़ी: <span id="vw" class="res-val">0</span></div>
    <div>⛏️ पत्थर: <span id="vs" class="res-val">0</span></div>
    <div>🍎 भोजन: <span id="vf" class="res-val">5</span></div>
  </div>

  <div id="stats" class="hud-box">
    <div style="font-size:11px; font-weight:bold;">स्वास्थ्य (HP) <span id="hp-t" style="float:right;">100</span></div>
    <div class="bar-bg"><div id="hp-b" class="bar-fill bar-hp" style="width:100%"></div></div>
    <div style="font-size:11px; font-weight:bold;">ऊर्जा (Hunger) <span id="hun-t" style="float:right;">100%</span></div>
    <div class="bar-bg"><div id="hun-b" class="bar-fill bar-hunger" style="width:100%"></div></div>
  </div>

  <div id="crafting" class="hud-box interactive">
    <div style="font-size:11px; font-weight:bold; color:#f59e0b; margin-bottom:4px;">🔨 क्राफ्टिंग (शॉर्टकट)</div>
    <button class="c-btn" onclick="world.eat()"><span>[E] 🍎 सेब खाएं</span><small>+25 HP</small></button>
    <button class="c-btn" id="b-pick" onclick="world.craft('pickaxe')"><span>[2] ⛏️ Pickaxe</span><small>15 Wood</small></button>
    <button class="c-btn" id="b-sw" onclick="world.craft('sword')"><span>[3] ⚔️ Sword</span><small>20W, 15S</small></button>
  </div>

  <div id="minimap-wrap">
    <canvas id="minimap"></canvas>
  </div>
</div>

<script>
class NetManager {
  constructor() {
    this.peer = null;
    this.conn = null;
  }
  host() {
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    this.peer = new Peer('s3d-' + code);
    this.peer.on('open', () => {
      document.getElementById('lobby').style.display = 'none';
      world.initAudio();
    });
    this.peer.on('connection', (c) => {
      this.conn = c;
      c.on('data', d => world.updateRemotePlayer(d));
    });
  }
  join() {
    const code = document.getElementById('jcode').value.trim();
    if (!code) return alert('कोड दर्ज करें!');
    this.peer = new Peer();
    this.peer.on('open', () => {
      this.conn = this.peer.connect('s3d-' + code);
      this.conn.on('open', () => {
        document.getElementById('lobby').style.display = 'none';
        world.initAudio();
      });
      this.conn.on('data', d => world.updateRemotePlayer(d));
    });
  }
  solo() {
    document.getElementById('lobby').style.display = 'none';
    world.initAudio();
  }
  send(data) {
    if (this.conn && this.conn.open) this.conn.send(data);
  }
}
const net = new NetManager();

class World3D {
  constructor() {
    this.container = document.getElementById('canvas3d');
    this.mCanvas = document.getElementById('minimap');
    this.mCtx = this.mCanvas.getContext('2d');
    this.mCanvas.width = 140; this.mCanvas.height = 140;

    this.res = { wood: 0, stone: 0, food: 5, hp: 100, hunger: 100, weapon: 'fist' };

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x87ceeb);
    this.scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

    this.camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    this.renderer = new THREE.WebGLRenderer({ canvas: this.container, antialias: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = true;

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x445533, 0.75);
    this.scene.add(hemiLight);

    this.sun = new THREE.DirectionalLight(0xfffaed, 0.9);
    this.sun.position.set(60, 100, 40);
    this.sun.castShadow = true;
    this.scene.add(this.sun);

    this.trees = [];
    this.rocks = [];
    this.particles = [];
    this.remoteMesh = null;

    this.keys = {};
    this.mouseRot = { yaw: 0, pitch: 0.1 };
    this.swinging = false;
    this.swingProgress = 0;
    this.walkCycle = 0;
    this.velocityY = 0;
    this.isGrounded = true;

    this.buildTerrain();
    this.buildCharacter();
    this.populateWorld();
    this.bindEvents();
  }

  initAudio() {
    this.actx = new (window.AudioContext || window.webkitAudioContext)();
  }

  playBeep(f, dur) {
    if (!this.actx) return;
    try {
      const osc = this.actx.createOscillator();
      const g = this.actx.createGain();
      osc.connect(g); g.connect(this.actx.destination);
      osc.frequency.setValueAtTime(f, this.actx.currentTime);
      g.gain.setValueAtTime(0.2, this.actx.currentTime);
      g.gain.linearRampToValueAtTime(0.01, this.actx.currentTime + dur);
      osc.start(); osc.stop(this.actx.currentTime + dur);
    } catch(e){}
  }

  buildTerrain() {
    const geo = new THREE.PlaneGeometry(320, 320, 32, 32);
    geo.rotateX(-Math.PI / 2);
    const mat = new THREE.MeshLambertMaterial({ color: 0x438a3a });
    const ground = new THREE.Mesh(geo, mat);
    ground.receiveShadow = true;
    this.scene.add(ground);
  }

  buildCharacter() {
    this.charGroup = new THREE.Group();

    // Materials
    const skinMat = new THREE.MeshLambertMaterial({ color: 0xf6c89f });
    const shirtMat = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
    const pantsMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
    const hairMat = new THREE.MeshLambertMaterial({ color: 0x451a03 });

    // Torso
    this.torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.1, 0.45), shirtMat);
    this.torso.position.y = 1.45;
    this.torso.castShadow = true;
    this.charGroup.add(this.torso);

    // Head + Hair
    this.head = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), skinMat);
    this.head.position.y = 2.25;
    const hair = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.2, 0.58), hairMat);
    hair.position.y = 0.22;
    this.head.add(hair);
    this.charGroup.add(this.head);

    // Left Arm
    this.leftArm = new THREE.Group();
    const lArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.9, 0.28), skinMat);
    lArmMesh.position.y = -0.35;
    this.leftArm.add(lArmMesh);
    this.leftArm.position.set(-0.55, 1.85, 0);
    this.charGroup.add(this.leftArm);

    // Right Arm (Weapon holder)
    this.rightArm = new THREE.Group();
    const rArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.9, 0.28), skinMat);
    rArmMesh.position.y = -0.35;
    this.rightArm.add(rArmMesh);
    this.rightArm.position.set(0.55, 1.85, 0);

    // Tool Mesh (Pickaxe / Sword)
    this.toolGroup = new THREE.Group();
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.3), new THREE.MeshLambertMaterial({ color: 0x78350f }));
    stick.rotation.x = Math.PI / 2;
    const headPart = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.15, 0.15), new THREE.MeshLambertMaterial({ color: 0x94a3b8 }));
    headPart.position.set(0, 0, 0.55);
    this.toolGroup.add(stick, headPart);
    this.toolGroup.position.set(0, -0.65, 0.3);
    this.toolGroup.visible = false;
    this.rightArm.add(this.toolGroup);

    this.charGroup.add(this.rightArm);

    // Left Leg
    this.leftLeg = new THREE.Group();
    const lLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.95, 0.32), pantsMat);
    lLegMesh.position.y = -0.45;
    this.leftLeg.add(lLegMesh);
    this.leftLeg.position.set(-0.22, 0.95, 0);
    this.charGroup.add(this.leftLeg);

    // Right Leg
    this.rightLeg = new THREE.Group();
    const rLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.95, 0.32), pantsMat);
    rLegMesh.position.y = -0.45;
    this.rightLeg.add(rLegMesh);
    this.rightLeg.position.set(0.22, 0.95, 0);
    this.charGroup.add(this.rightLeg);

    this.scene.add(this.charGroup);
  }

  populateWorld() {
    // 3D Realistic Trees
    for (let i = 0; i < 48; i++) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.6, 3.8, 8),
        new THREE.MeshLambertMaterial({ color: 0x5c3a21 })
      );
      trunk.position.y = 1.9;
      trunk.castShadow = true;

      const f1 = new THREE.Mesh(new THREE.ConeGeometry(2.4, 3.0, 8), new THREE.MeshLambertMaterial({ color: 0x166534 }));
      f1.position.y = 4.2;
      const f2 = new THREE.Mesh(new THREE.ConeGeometry(1.8, 2.5, 8), new THREE.MeshLambertMaterial({ color: 0x22c55e }));
      f2.position.y = 5.4;

      tree.add(trunk, f1, f2);
      tree.position.set((Math.random() - 0.5) * 270, 0, (Math.random() - 0.5) * 270);
      tree.userData = { type: 'tree', hp: 80 };
      this.scene.add(tree);
      this.trees.push(tree);
    }

    // 3D Rocks
    for (let i = 0; i < 32; i++) {
      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1.5 + Math.random() * 0.7, 1),
        new THREE.MeshLambertMaterial({ color: 0x64748b })
      );
      rock.scale.set(1.3, 0.8, 1.2);
      rock.position.set((Math.random() - 0.5) * 270, 0.8, (Math.random() - 0.5) * 270);
      rock.castShadow = true;
      rock.userData = { type: 'rock', hp: 100 };
      this.scene.add(rock);
      this.rocks.push(rock);
    }
  }

  bindEvents() {
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      this.keys[k] = true;

      // Keyboard Shortcuts
      if (k === 'e') this.eat();
      if (k === '1') { this.res.weapon = 'fist'; this.toolGroup.visible = false; }
      if (k === '2') this.craft('pickaxe');
      if (k === '3') this.craft('sword');
      if (k === ' ' && this.isGrounded) {
        this.velocityY = 0.35;
        this.isGrounded = false;
        this.playBeep(300, 0.08);
      }
    });

    window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);

    window.addEventListener('click', () => {
      if (document.getElementById('lobby').style.display === 'none') {
        this.container.requestPointerLock();
      }
    });

    window.addEventListener('mousemove', e => {
      if (document.pointerLockElement === this.container) {
        this.mouseRot.yaw -= e.movementX * 0.003;
        this.mouseRot.pitch -= e.movementY * 0.003;
        this.mouseRot.pitch = Math.max(-0.6, Math.min(0.6, this.mouseRot.pitch));
      }
    });

    window.addEventListener('mousedown', () => {
      if (document.pointerLockElement === this.container && !this.swinging) {
        this.swinging = true;
        this.swingProgress = 1.0;
        this.playBeep(220, 0.08);
      }
    });

    window.addEventListener('resize', () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  craft(type) {
    if (type === 'pickaxe' && this.res.wood >= 15) {
      this.res.wood -= 15;
      this.res.weapon = 'pickaxe';
      this.toolGroup.visible = true;
      this.playBeep(520, 0.15);
    } else if (type === 'sword' && this.res.wood >= 20 && this.res.stone >= 15) {
      this.res.wood -= 20; this.res.stone -= 15;
      this.res.weapon = 'sword';
      this.toolGroup.visible = true;
      this.playBeep(700, 0.2);
    } else if (this.res.weapon === type) {
      this.toolGroup.visible = true;
    }
    this.updateHUD();
  }

  eat() {
    if (this.res.food > 0 && this.res.hp < 100) {
      this.res.food--;
      this.res.hp = Math.min(100, this.res.hp + 25);
      this.res.hunger = Math.min(100, this.res.hunger + 30);
      this.playBeep(440, 0.12);
      this.updateHUD();
    }
  }

  updateHUD() {
    document.getElementById('vw').innerText = this.res.wood;
    document.getElementById('vs').innerText = this.res.stone;
    document.getElementById('vf').innerText = this.res.food;
    document.getElementById('hp-b').style.width = this.res.hp + '%';
    document.getElementById('hp-t').innerText = Math.round(this.res.hp);
    document.getElementById('hun-b').style.width = this.res.hunger + '%';
    document.getElementById('hun-t').innerText = Math.round(this.res.hunger) + '%';
    document.getElementById('b-pick').disabled = this.res.wood < 15;
    document.getElementById('b-sw').disabled = (this.res.wood < 20 || this.res.stone < 15);
  }

  updateRemotePlayer(d) {
    if (!this.remoteMesh) {
      this.remoteMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 1.8, 0.5),
        new THREE.MeshLambertMaterial({ color: 0x10b981 })
      );
      this.scene.add(this.remoteMesh);
    }
    this.remoteMesh.position.set(d.x, d.y, d.z);
    this.remoteMesh.rotation.y = d.rot;
  }

  update() {
    this.charGroup.rotation.y = this.mouseRot.yaw;

    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.mouseRot.yaw);
    const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.mouseRot.yaw);
    const speed = 0.28;

    let isMoving = false;
    if (this.keys['w']) { this.charGroup.position.addScaledVector(forward, speed); isMoving = true; }
    if (this.keys['s']) { this.charGroup.position.addScaledVector(forward, -speed); isMoving = true; }
    if (this.keys['a']) { this.charGroup.position.addScaledVector(side, -speed); isMoving = true; }
    if (this.keys['d']) { this.charGroup.position.addScaledVector(side, speed); isMoving = true; }

    // Jump / Gravity Physics
    if (!this.isGrounded) {
      this.charGroup.position.y += this.velocityY;
      this.velocityY -= 0.02; // Gravity
      if (this.charGroup.position.y <= 0) {
        this.charGroup.position.y = 0;
        this.velocityY = 0;
        this.isGrounded = true;
      }
    }

    // Walking Animation (Limbs Swing)
    if (isMoving && this.isGrounded) {
      this.walkCycle += 0.15;
      const legAngle = Math.sin(this.walkCycle) * 0.6;
      this.leftLeg.rotation.x = legAngle;
      this.rightLeg.rotation.x = -legAngle;
      this.leftArm.rotation.x = -legAngle;
      if (!this.swinging) this.rightArm.rotation.x = legAngle;
    } else if (this.isGrounded) {
      this.leftLeg.rotation.x = 0;
      this.rightLeg.rotation.x = 0;
      this.leftArm.rotation.x = 0;
      if (!this.swinging) this.rightArm.rotation.x = 0;
    }

    // World Bounds
    this.charGroup.position.x = Math.max(-150, Math.min(150, this.charGroup.position.x));
    this.charGroup.position.z = Math.max(-150, Math.min(150, this.charGroup.position.z));

    // Third-person camera tracking
    const camOffset = new THREE.Vector3(0, 3.4 + this.mouseRot.pitch * 3.5, 6.8).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.mouseRot.yaw);
    this.camera.position.copy(this.charGroup.position).add(camOffset);
    this.camera.lookAt(this.charGroup.position.x, this.charGroup.position.y + 1.8, this.charGroup.position.z);

    // Hand Swing Action
    if (this.swinging) {
      this.swingProgress -= 0.12;
      this.rightArm.rotation.x = -Math.sin(this.swingProgress * Math.PI) * 1.5;
      if (this.swingProgress <= 0) {
        this.swinging = false;
        this.rightArm.rotation.x = 0;
        this.resolveHarvest();
      }
    }

    net.send({
      x: this.charGroup.position.x,
      y: this.charGroup.position.y,
      z: this.charGroup.position.z,
      rot: this.charGroup.rotation.y
    });

    this.renderer.render(this.scene, this.camera);
    this.renderMinimap();
  }

  resolveHarvest() {
    const pPos = this.charGroup.position;
    this.trees.forEach(t => {
      if (pPos.distanceTo(t.position) < 5.0) {
        t.userData.hp -= (this.res.weapon === 'pickaxe' ? 30 : 15);
        this.playBeep(180, 0.1);
        this.res.wood += 5;
        if (Math.random() < 0.35) this.res.food += 1;
        this.updateHUD();
      }
    });

    this.rocks.forEach(r => {
      if (pPos.distanceTo(r.position) < 4.5) {
        r.userData.hp -= (this.res.weapon === 'pickaxe' ? 35 : 12);
        this.playBeep(320, 0.1);
        this.res.stone += 4;
        this.updateHUD();
      }
    });
  }

  renderMinimap() {
    const ctx = this.mCtx;
    ctx.clearRect(0, 0, 140, 140);
    const center = 70;
    const scale = 0.7;

    // Draw Radar Rings
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
    ctx.beginPath(); ctx.arc(center, center, 45, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(center, center, 65, 0, Math.PI * 2); ctx.stroke();

    const px = this.charGroup.position.x;
    const pz = this.charGroup.position.z;

    // Trees on Radar (Green dots)
    ctx.fillStyle = '#22c55e';
    this.trees.forEach(t => {
      const dx = (t.position.x - px) * scale;
      const dz = (t.position.z - pz) * scale;
      if (Math.hypot(dx, dz) < 65) {
        ctx.fillRect(center + dx - 2, center + dz - 2, 4, 4);
      }
    });

    // Rocks on Radar (Gray dots)
    ctx.fillStyle = '#94a3b8';
    this.rocks.forEach(r => {
      const dx = (r.position.x - px) * scale;
      const dz = (r.position.z - pz) * scale;
      if (Math.hypot(dx, dz) < 65) {
        ctx.fillRect(center + dx - 2, center + dz - 2, 4, 4);
      }
    });

    // Player Indicator (Arrow facing direction)
    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(-this.mouseRot.yaw);
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.lineTo(5, 5);
    ctx.lineTo(-5, 5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  loop() {
    this.update();
    requestAnimationFrame(() => this.loop());
  }
}

const world = new World3D();
world.loop();
</script>
